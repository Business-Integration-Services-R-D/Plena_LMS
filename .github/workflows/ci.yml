name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        env:
          REACT_APP_BACKEND_URL: ""
          REACT_APP_AUTH_BYPASS: "false"
          GENERATE_SOURCEMAP: "false"
        run: yarn build

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/plena-lms

      - name: Render Kubernetes manifests
        run: |
          helm template plena-lms deploy/helm/plena-lms \
            --namespace plena-lms \
            --set backend.image.repository=registry.example/plena-lms-backend \
            --set backend.image.tag=test \
            --set frontend.image.repository=registry.example/plena-lms-frontend \
            --set frontend.image.tag=test \
            --set config.s3Bucket=test-bucket >/dev/null

      - name: Package chart
        run: |
          mkdir -p dist
          helm package deploy/helm/plena-lms --destination dist

      - name: Upload Helm package
        uses: actions/upload-artifact@v4
        with:
          name: plena-lms-helm
          path: dist/plena-lms-*.tgz
          if-no-files-found: error
