backend:
  image:
    repository: REGISTRY/plena-lms-backend
    tag: RELEASE_TAG

frontend:
  image:
    repository: REGISTRY/plena-lms-frontend
    tag: RELEASE_TAG

config:
  appUrl: https://lms.bislabs.tech
  corsAllowedOrigins: https://lms.bislabs.tech
  storageDriver: local
  s3Bucket: ""
  emailFrom: Plena LMS <noreply@bislabs.tech>

# Backend ve video worker aynı RWX SMB volume'u kullanmalıdır.
persistence:
  enabled: true
  existingClaim: REPLACE_WITH_RWX_SMB_PVC
  mountPath: /app/storage/videos

ingress:
  annotations:
    # Video 16 MiB parçalarla, PDF ise tek istekte (max 50 MB) yüklenir.
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  host: lms.bislabs.tech
  tls:
    enabled: true
    secretName: plena-lms-tls

serviceAccount:
  annotations: {}
