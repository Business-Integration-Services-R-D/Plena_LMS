apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plena-lms.fullname" . }}
  labels:
    {{- include "plena-lms.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  APP_URL: {{ .Values.config.appUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  APP_TIMEZONE: {{ .Values.config.appTimezone | quote }}
  STORAGE_DRIVER: {{ .Values.config.storageDriver | quote }}
  LOCAL_STORAGE_ROOT: {{ .Values.persistence.mountPath | quote }}
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  EMAIL_FROM: {{ .Values.config.emailFrom | quote }}
  SEED_ON_START: {{ .Values.config.seedOnStart | quote }}
  VIDEO_WORKER_POLL_MS: {{ .Values.videoWorker.compression.pollMs | quote }}
  VIDEO_COMPRESSION_CRF: {{ .Values.videoWorker.compression.crf | quote }}
  VIDEO_COMPRESSION_PRESET: {{ .Values.videoWorker.compression.preset | quote }}
  VIDEO_COMPRESSION_MAX_WIDTH: {{ .Values.videoWorker.compression.maxWidth | quote }}
  VIDEO_COMPRESSION_MAX_HEIGHT: {{ .Values.videoWorker.compression.maxHeight | quote }}
  VIDEO_COMPRESSION_MAX_RATE: {{ .Values.videoWorker.compression.maxRate | quote }}
  VIDEO_COMPRESSION_BUFFER_SIZE: {{ .Values.videoWorker.compression.bufferSize | quote }}
  VIDEO_COMPRESSION_AUDIO_BITRATE: {{ .Values.videoWorker.compression.audioBitrate | quote }}
  VIDEO_COMPRESSION_THREADS: {{ .Values.videoWorker.compression.threads | quote }}
  VIDEO_COMPRESSION_DELETE_GRACE_HOURS: {{ .Values.videoWorker.compression.deleteGraceHours | quote }}
  VIDEO_COMPRESSION_STALE_AFTER_MINUTES: {{ .Values.videoWorker.compression.staleAfterMinutes | quote }}
