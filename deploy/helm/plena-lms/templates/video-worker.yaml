{{- if .Values.videoWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plena-lms.fullname" . }}-video-worker
  labels:
    {{- include "plena-lms.labels" . | nindent 4 }}
    app.kubernetes.io/component: video-worker
spec:
  replicas: {{ .Values.videoWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "plena-lms.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: video-worker
  template:
    metadata:
      labels:
        {{- include "plena-lms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: video-worker
    spec:
      serviceAccountName: {{ include "plena-lms.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: video-worker
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["npm", "run", "worker:video"]
          envFrom:
            - configMapRef:
                name: {{ include "plena-lms.fullname" . }}
            - secretRef:
                name: {{ .Values.secret.existingSecret }}
          resources:
            {{- toYaml .Values.videoWorker.resources | nindent 12 }}
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir:
            sizeLimit: {{ .Values.videoWorker.tempStorage }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
