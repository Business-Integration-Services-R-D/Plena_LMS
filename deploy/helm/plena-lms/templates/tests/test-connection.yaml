apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "plena-lms.fullname" . }}-test-connection"
  labels:
    {{- include "plena-lms.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - wget
        - -qO-
        - http://{{ include "plena-lms.fullname" . }}-backend:{{ .Values.backend.service.port }}/api/health
